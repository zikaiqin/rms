<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Planificateur</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/material-symbols@0.2.3/outlined.css"/>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.0.6/css/pico.min.css"/>
        <link rel="stylesheet" href="@styles/main.css"/>
        <link rel="stylesheet" href="@styles/planner.css"/>
    </head>
    <body class="full-height vert-flex">
        <header class="container">
            <nav>
                <ul>
                    <!-- Page title -->
                    <li><h1>Planificateur d'horaires</h1></li>
                </ul>
                <ul>
                    <!-- Navigation to other pages -->
                    <li>
                        <details class="dropdown">
                            <summary role="button" class="outline contrast">
                                Surveillances
                            </summary>
                            <ul dir="rtl">
                                <li><a href="/schedule/staff">Par Gardien</a></li>
                                <li><a href="/schedule/sector">Par Secteur</a></li>
                                <li><a role="link" class="secondary current-page" aria-current="page">Planificateur</a></li>
                            </ul>
                        </details>
                    </li>
                    <li><a href="/sector" class="contrast">Secteurs</a></li>
                    <li><a href="/salary" class="contrast">Salaires</a></li>
                    <li><a href="/staff" class="contrast">Employés</a></li>
                </ul>
            </nav>
        </header>
        <main class="container stretch vert-flex overflow-auto">
            <div role="main" class="stretch vert-flex overflow-auto">
                <table id="planner" class="two-tone stretch"></table>
            </div>
            <div class="action-container">
                <input id="date-picker" type="date" required />
                <div role="group" class="icon-button-group">
                    <button
                        id="reset"
                        class="icon-button outline secondary material-symbols-outlined"
                        title="Réinitialiser"
                        disabled>
                        replay
                    </button>
                    <button
                        id="save"
                        class="icon-button outline secondary material-symbols-outlined"
                        title="Enregistrer"
                        disabled>
                        save
                    </button>
                </div>
            </div>
        </main>
        <footer class="container"></footer>
        <div id="modal-container">
            <dialog id="change-modal">
                <article>
                    <h3>Horaire modifié</h3>
                    <p>
                        Les modifications à l'horaire ne sont pas enregistrées.
                        <br>
                        Voulez-vous changer de date sans enregistrer?
                    </p>
                    <footer>
                        <button aria-label="close" class="secondary">
                            Annuler
                        </button>
                        <button id="confirm-change" class="danger">
                            Changer de date
                        </button>
                    </footer>
                </article>
            </dialog>
        </div>
        <script type="module" src="@scripts/pages/schedule-planner.js"></script>
    </body>
</html>
